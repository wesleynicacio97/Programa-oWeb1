<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - Non-Green Finances</title>

  <!-- Caminho corrigido -->
  <link rel="stylesheet" href="../static/css/style.css">
  <script defer src="../static/js/main.js"></script>
</head>

<body>

  <header class="navbar">
    <div class="logo">💸 Non-Green Finances</div>
    <nav class="menu">
      <a href="index.html">Início</a>
      <a href="register.html">Registrar</a>
    </nav>
  </header>

  <main class="login-container">
    <h1>Entrar</h1>

    <form class="form-box">
      <label>Email</label>
      <input type="email" placeholder="seuemail@exemplo.com">

      <label>Senha</label>
      <input type="password" placeholder="Digite sua senha">

      <button class="btn-primary">Entrar</button>
    </form>
    
    <div class="social-login">
      <button class="btn-google">
       <img src="../static/img/google.png" alt="">
       Entrar com Google
      </button>

      <button class="btn-apple">
        <img src="../static/img/apple.png" alt="">
         Entrar com Apple
      </button>
    </div>

    <p class="text-center">Não tem conta?  
      <a href="register.html">Crie uma agora</a>
    </p>
  </main>

  <footer class="footer">
    <p>© 2025 Non-Green Finances</p>
  </footer>

</body>
</html>
