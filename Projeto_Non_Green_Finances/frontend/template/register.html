<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Registrar - Non-Green Finances</title>

  <!-- Caminho corrigido -->
  <link rel="stylesheet" href="../static/css/style.css">
  <script defer src="../static/js/main.js"></script>
</head>

<body>

  <header class="navbar">
    <div class="logo">💸 Non-Green Finances</div>
    <nav class="menu">
      <a href="index.html">Início</a>
      <a href="login.html">Login</a>
    </nav>
  </header>

  <main class="login-container">
    <h1>Criar Conta</h1>

    <form class="form-box">

      <label>Nome</label>
      <input type="text" placeholder="Seu nome completo">

      <label>Email</label>
      <input type="email" placeholder="seuemail@exemplo.com">

      <label>Senha</label>
      <input type="password" placeholder="Crie uma senha">

      <label>Confirmar Senha</label>
      <input type="password" placeholder="Repita a senha">

      <button class="btn-primary">Registrar</button>
    </form>

    <div class="social-login">
      <button class="btn-google">
        <img src="../static/img/google.png" alt="">
        Registrar com Google
      </button>

      <button class="btn-apple">
        <img src="../static/img/apple.png" alt="">
        Registrar com Apple
      </button>
    </div>

    <p class="text-center">Já tem conta?  
      <a href="login.html">Faça login</a>
    </p>
  </main>

  <footer class="footer">
    <p>© 2025 Non-Green Finances</p>
  </footer>

</body>
</html>
